title: XALT Docs
description: Dokumentation & Ressourcen
lang: de
url: "https://hub.xalt.community"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Neue Inhalte:
# - Skills auflisten: marketplace.json im agent-skills-Repo (automatisch via skills-listing.js)
# - Skill-Detailseite im Hub: layout skill + download_id + Artikel in <article class="prose">
#   (CTA, SKILL.md-Vorschau und Lizenz kommen automatisch aus dem Layout)
#   + Eintrag in _data/skill_pages.yml → detail_pages
# - Checklisten/Templates: layout download-preview + download_id in _data/downloads.yml

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
