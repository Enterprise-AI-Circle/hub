title: XALT Docs
description: Dokumentation & Ressourcen
lang: de
url: "https://enterprise-ai-circle.github.io"
baseurl: "/hub"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Neue Inhalte:
# - Skills auflisten: marketplace.json im agent-skills-Repo (automatisch via skills-listing.js)
# - Skill-Detailseite im Hub: layout skill + download_id + Eintrag in _data/skill-pages.yml
# - Checklisten/Templates: layout download-preview + download_id in _data/downloads.yml

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - blogposts
