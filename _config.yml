title: XALT Docs
description: Dokumentation & Ressourcen
lang: de
url: "https://enterprise-ai-circle.github.io"
baseurl: "/hub"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Neue Download-Seiten:
# - Checklisten/Templates: layout download-preview + download_id (siehe _data/downloads.yml)
# - Skills: layout skill + download_id + Artikel-Inhalt in <article class="prose">

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - blogposts
